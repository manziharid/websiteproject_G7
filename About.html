<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/dist/output.css">
    <title>Website project template</title>
</head>
<script>
    const sections = [
        { id: 'contact', url: 'src/sections/contact.html' },
    ];

    const loadComponent = async ({ id, url }) => {
        const target = document.getElementById(id);
        try {
            const res = await fetch(url);
            if (!res.ok) throw new Error(`Failed to load ${url}: ${res.status}`);
            target.innerHTML = await res.text();
        } catch (err) {
            console.error(err);
            target.innerHTML = `<!-- failed to load ${url} -->`;
        }
    };

    document.addEventListener('DOMContentLoaded', () => {
        sections.forEach(loadComponent);
    });

    function toggleMobileMenu() {
    const menu = document.getElementById('mobile-menu');
    const btn = document.getElementById('menu-toggle-btn');
    const isOpen = !menu.classList.contains('hidden');

    if (isOpen) {
        menu.classList.add('hidden');
        menu.classList.remove('flex');
        btn.src = 'Group 5 (2).png';
    } else {
        menu.classList.remove('hidden');
        menu.classList.add('flex');
        btn.src = 'Group 4.png';
    }
}

</script>
<body class="text-[#00672E]">
    <div id="contact"></div>
</body>
</html>
