<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/dist/output.css">
    <title>Website project template</title>
</head>
<script>
    const loadComponents = (id, url) =>  {
        fetch(url)
        .then((response) => response.text())
        .then((html) => {
            document.getElementById(id).innerHTML = html;
        });
    }
    window.onload = () => {
        loadComponents('header', 'src/sections/header.html');
        loadComponents('service', 'src/sections/service.html');
        loadComponents('footer', 'src/sections/footer.html');
    }
     function toggleMobileMenu() {
    const menu = document.getElementById('mobile-menu');
    const btn = document.getElementById('menu-toggle-btn');
    const isOpen = !menu.classList.contains('hidden');

    if (isOpen) {
        menu.classList.add('hidden');
        menu.classList.remove('flex');
        btn.src = '/image/Group 5.png';
    } else {
        menu.classList.remove('hidden');
        menu.classList.add('flex');
        btn.src = 'Group 4.png';
    }
}
</script>
<body class="text-[#00672E]">
    <div id="service"></div>
    <div id="footer"></div>
</body>
</html>
